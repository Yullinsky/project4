{% extends "network/layout.html" %}

{% block body %}
    {% if user.is_authenticated %}
        <div class="card mb-4">
            <div class="card-body">
                <h5>New Post</h5>
                <form action="{% url 'create' %}" method="POST">
                    {% csrf_token %}
                    <textarea name="body" class="form-control" rows="3" placeholder="What's happening?" maxlength="640" required></textarea>
                    <button type="submit" class="btn btn-primary mt-2">Post</button>
                </form>
            </div>
        </div>
    {% else %}
        <div class="card mb-4">
            <div class="card-body">
                <h5>You need to be logged in to Post</h5>
            </div>
        </div> 
    {% endif %}
{% endblock %}
